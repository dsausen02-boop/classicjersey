<script>
  // ─── SUPABASE CONFIG ───────────────────────────────────────────────────────
  // 1. Go to supabase.com → New Project
  // 2. Settings → API → copy Project URL and anon/public key
  // 3. Paste them below
  const SUPABASE_URL  = 'YOUR_SUPABASE_URL';   // e.g. https://xxxx.supabase.co
  const SUPABASE_KEY  = 'YOUR_SUPABASE_ANON_KEY';
  // ──────────────────────────────────────────────────────────────────────────
  // SQL to run once in Supabase → SQL Editor:
  //
  // create table orders (
  //   id bigint generated always as identity primary key,
  //   created_at timestamptz default now(),
  //   name text, phone text, email text,
  //   address text, city text, notes text,
  //   payment_method text,
  //   items jsonb,
  //   total int,
  //   status text default 'ממתין לאישור'
  // );
  // alter table orders enable row level security;
  // create policy "insert orders" on orders for insert with check (true);
  // create policy "read orders" on orders for select using (true);
  // ──────────────────────────────────────────────────────────────────────────
  const supabaseReady = SUPABASE_URL !== 'YOUR_SUPABASE_URL';
  window.db = supabaseReady
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;
</script>

input,select,textarea{background:#f5f3ef;color:#0d0d0d;border:1.5px solid #e8e6e1;outline:none;width:100%;border-radius:4px}
input:focus,select:focus,textarea:focus{border-color:#0d0d0d}

.fade-up{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.slide-left{animation:slideLeft .28s ease both}

/* ─── CATALOG ────────────────────────────────────────────────────── */
function CatalogPage({products,setPage,setSelectedProduct,addToCart}){
  const [team,setTeam]=useState('הכל');
  const [league,setLeague]=useState('הכל');
  const [era,setEra]=useState('הכל');
  const [max,setMax]=useState(400);
  const [sort,setSort]=useState('default');
  const [filtersOpen,setFiltersOpen]=useState(true);

  let list=products
    .filter(p=>team==='הכל'||p.team===team)
    .filter(p=>league==='הכל'||p.league===league)
    .filter(p=>era==='הכל'||p.era===era)
    .filter(p=>p.price<=max);
  if(sort==='asc') list=[...list].sort((a,b)=>a.price-b.price);
  if(sort==='desc') list=[...list].sort((a,b)=>b.price-a.price);

  return(
    <div className="max-w-7xl mx-auto px-5 py-10 fade-up">
      {/* Header */}
      <div className="flex items-end justify-between mb-6">
        <select value={sort} onChange={e=>setSort(e.target.value)} className="rounded px-3 py-2 text-sm w-40">
          <option value="default">מיון</option>
          <option value="asc">מחיר: נמוך→גבוה</option>
          <option value="desc">מחיר: גבוה→נמוך</option>
        </select>
        <div className="text-right">
          <h1 className="display text-4xl font-black text-ink">כל הגופיות</h1>
          <p className="text-sm text-mid mt-1">{list.length} מוצרים</p>
        </div>
      </div>

      {/* Filter toggle */}
      <button onClick={()=>setFiltersOpen(v=>!v)} className="btn-outline rounded px-4 py-2 text-sm mb-4">
        {filtersOpen?'הסתר סינון ↑':'הצג סינון ↓'}
      </button>

      {/* Filters */}
      {filtersOpen&&(
        <div className="bg-white border border-smoke rounded p-5 mb-8 space-y-4">
          <ChipRow label="קבוצה" opts={TEAMS} val={team} set={setTeam}/>
          <ChipRow label="ליגה" opts={LEAGUES} val={league} set={setLeague}/>
          <ChipRow label="עונה" opts={ERAS} val={era} set={setEra}/>
          <div className="flex items-center gap-4 pt-3 border-t border-smoke">
            <span className="text-sm font-bold text-mid min-w-max">מחיר עד ₪{max}</span>
            <input type="range" min="100" max="400" step="10" value={max} onChange={e=>setMax(+e.target.value)}
              style={{accentColor:'#0d0d0d'}} className="flex-1 cursor-pointer"/>
          </div>
        </div>
      )}

      {/* Grid */}
      <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
        {list.length===0
          ?<div className="col-span-4 text-center py-20 text-mid">לא נמצאו תוצאות</div>
          :list.map(p=><ProductCard key={p.id} p={p} setPage={setPage} setSelectedProduct={setSelectedProduct} addToCart={addToCart}/>)
        }
      </div>
    </div>
  );
}

function ChipRow({label,opts,val,set}){
  return(
    <div className="flex flex-wrap items-center gap-2">
      <span className="text-xs font-bold text-mid w-20 flex-shrink-0">{label}:</span>
      {opts.map(o=>(
        <button key={o} onClick={()=>set(o)} className={`chip rounded-full px-3 py-1 ${val===o?'on':''}`}>{o}</button>
      ))}
    </div>
  );
}

/* ─── PRODUCT DETAIL ─────────────────────────────────────────────── */
function ProductPage({product,addToCart,setPage}){
  const [imgError,setImgError]=useState(false);
  const [size,setSize]=useState('L');
  const [name,setName]=useState('');
  const [num,setNum]=useState('');
  const [qty,setQty]=useState(1);
  const [done,setDone]=useState(false);

  if(!product) return null;

  const customPrice = (name||num) ? 25 : 0;
  const lineTotal = (product.price + customPrice) * qty;

  const add=()=>{
    for(let i=0;i<qty;i++) addToCart(product,size,name,num);
    setDone(true);
    setTimeout(()=>setDone(false),2200);
  };

  return(
    <div className="max-w-6xl mx-auto px-5 py-10 fade-up">
      <button onClick={()=>setPage('catalog')} className="text-sm text-mid hover:text-ink transition-colors mb-8 flex items-center gap-1">← חזרה לחנות</button>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-10 lg:gap-16">
        {/* Image */}
        <div className="space-y-3">
          <div className="overflow-hidden bg-smoke" style={{aspectRatio:'4/5',background:imgError?product.color:'#eee'}}>
            {!imgError&&(
              <img src={product.img} alt={product.name} className="w-full h-full object-cover"
                onError={()=>setImgError(true)}/>
            )}
          </div>
          <div className="grid grid-cols-3 gap-3">
            {[0,1,2].map(i=>(
              <div key={i} className="overflow-hidden cursor-pointer" style={{aspectRatio:'1',background:'#eee'}}>
                {!imgError&&<img src={product.img} alt="" className="w-full h-full object-cover opacity-70 hover:opacity-100 transition-opacity"/>}
              </div>
            ))}
          </div>
        </div>

        {/* Details */}
        <div className="text-right flex flex-col">
          {product.badge&&<div className="mb-3"><Badge type={product.badgeType} label={product.badge}/></div>}
          <p className="text-sm text-mid font-medium mb-2">{product.team} · {product.era}</p>
          <h1 className="display text-3xl font-black text-ink leading-tight mb-4">{product.name}</h1>

          <div className="flex items-baseline gap-3 mb-5">
            <span className="text-3xl font-black text-ink">₪{product.price}</span>
            {product.oldPrice&&<span className="text-mid line-through text-lg">₪{product.oldPrice}</span>}
          </div>

          <p className="text-sm text-mid leading-relaxed mb-7">{product.description}</p>

          {/* Size */}
          <div className="mb-6">
            <p className="text-sm font-bold text-ink mb-3">מידה — <span className="text-red">{size}</span></p>
            <div className="flex gap-2 flex-wrap">
              {SIZES.map(s=>(
                <button key={s} onClick={()=>setSize(s)} className={`size-opt w-12 h-12 rounded ${size===s?'picked':''}`}>{s}</button>
              ))}
            </div>
          </div>

          {/* Custom */}
          <div className="border border-smoke rounded p-4 mb-6 bg-paper">
            <p className="text-sm font-bold text-ink mb-3">✂️ הדפסה אישית <span className="text-mid font-normal">(+₪25)</span></p>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-xs text-mid mb-1 block">שם לגב</label>
                <input value={name} onChange={e=>setName(e.target.value.toUpperCase())} maxLength={12}
                  placeholder="COHEN" className="px-3 py-2 text-sm font-mono tracking-widest text-center"/>
              </div>
              <div>
                <label className="text-xs text-mid mb-1 block">מספר</label>
                <input value={num} onChange={e=>setNum(e.target.value.replace(/\D/,''))} maxLength={2}
                  placeholder="7" className="px-3 py-2 text-sm font-mono text-center text-2xl"/>
              </div>
            </div>
          </div>

          {/* Qty */}
          <div className="flex items-center gap-4 mb-5">
            <div className="flex items-center border border-smoke rounded overflow-hidden">
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} className="w-10 h-10 flex items-center justify-center text-lg hover:bg-smoke transition-colors">−</button>
              <span className="w-10 text-center font-bold text-sm">{qty}</span>
              <button onClick={()=>setQty(q=>Math.min(10,q+1))} className="w-10 h-10 flex items-center justify-center text-lg hover:bg-smoke transition-colors">+</button>
            </div>
            <span className="text-sm text-mid">סה"כ: <strong className="text-ink">₪{lineTotal}</strong></span>
          </div>

          <button onClick={add} className={`w-full rounded py-4 font-bold text-base transition-all ${done?'btn-red':'btn-dark'}`}>
            {done?'✓ נוסף לסל!':'הוסף לסל'}
          </button>

          <div className="mt-5 text-right text-xs text-mid space-y-1.5">
            <p>✅ במלאי — {product.stock} יחידות</p>
            <p>🚚 משלוח תוך 3-5 ימי עסקים</p>
            <p>↩️ החזרה חינם תוך 30 יום</p>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── CART DRAWER ────────────────────────────────────────────────── */
function CartDrawer({cart,setCart,open,setOpen,setPage}){
  const total=cart.reduce((s,i)=>s+(i.price+(i.customName||i.customNum?25:0))*i.qty,0);
  const upd=(id,d)=>setCart(c=>c.map(i=>i.cid===id?{...i,qty:Math.max(0,i.qty+d)}:i).filter(i=>i.qty>0));

  if(!open) return null;
  return(
    <>
      <div className="cart-overlay" onClick={()=>setOpen(false)}/>
      <div className="cart-drawer slide-left">
        <div className="p-5 border-b border-smoke flex items-center justify-between">
          <button onClick={()=>setOpen(false)} className="text-mid hover:text-ink text-xl transition-colors">✕</button>
          <h2 className="font-black text-ink">הסל שלי ({cart.reduce((s,i)=>s+i.qty,0)})</h2>
        </div>

        <div className="flex-1 overflow-y-auto p-5 space-y-4">
          {cart.length===0&&(
            <div className="text-center py-20 text-mid">
              <p className="text-4xl mb-4">🛒</p>
              <p className="text-sm mb-5">הסל ריק</p>
              <button onClick={()=>{setOpen(false);setPage('catalog')}} className="btn-dark rounded px-5 py-2.5 text-sm">לחנות</button>
            </div>
          )}
          {cart.map(item=>(
            <div key={item.cid} className="flex gap-3">
              <div className="w-20 h-20 flex-shrink-0 overflow-hidden bg-smoke">
                <img src={item.img} alt={item.name} className="w-full h-full object-cover" onError={e=>{e.target.style.display='none'}}/>
              </div>
              <div className="flex-1 text-right">
                <p className="text-xs font-bold text-ink leading-tight mb-0.5">{item.name}</p>
                <p className="text-xs text-mid mb-2">
                  {item.size}
                  {item.customName&&` · ${item.customName}`}
                  {item.customNum&&` #${item.customNum}`}
                </p>
                <div className="flex items-center justify-between">
                  <div className="flex items-center border border-smoke rounded overflow-hidden">
                    <button onClick={()=>upd(item.cid,-1)} className="w-6 h-6 flex items-center justify-center text-xs hover:bg-smoke">−</button>
                    <span className="w-5 text-center text-xs font-bold">{item.qty}</span>
                    <button onClick={()=>upd(item.cid,1)} className="w-6 h-6 flex items-center justify-center text-xs hover:bg-smoke">+</button>
                  </div>
                  <span className="font-black text-sm text-ink">₪{(item.price+(item.customName||item.customNum?25:0))*item.qty}</span>
                </div>
              </div>
            </div>
          ))}
        </div>

        {cart.length>0&&(
          <div className="p-5 border-t border-smoke space-y-3">
            <div className="flex justify-between text-sm"><span className="text-mid">ביניים</span><span>₪{total}</span></div>
            <div className="flex justify-between text-sm"><span className="text-mid">משלוח</span><span className="text-green-600 font-bold">חינם</span></div>
            <div className="flex justify-between font-black text-lg border-t border-smoke pt-3"><span>סה"כ</span><span>₪{total}</span></div>
            <button onClick={()=>{setOpen(false);setPage('checkout')}} className="btn-dark w-full rounded py-3 font-bold text-sm">
              לקופה ←
            </button>
          </div>
        )}
      </div>
    </>
  );
}

/* ─── CHECKOUT ───────────────────────────────────────────────────── */
function CheckoutPage({cart,setCart,setPage}){
  const [form,setForm]=useState({name:'',phone:'',email:'',address:'',city:'',notes:''});
  const [pay,setPay]=useState('paypal');
  const [receipt,setReceipt]=useState(null);
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);
  const [saveErr,setSaveErr]=useState('');
  const total=cart.reduce((s,i)=>s+(i.price+(i.customName||i.customNum?25:0))*i.qty,0);

  const submit=async e=>{
    e.preventDefault();
    setSaving(true); setSaveErr('');
    if(window.db){
      const {error}=await window.db.from('orders').insert([{
        name:form.name, phone:form.phone, email:form.email,
        address:form.address, city:form.city, notes:form.notes,
        payment_method:pay,
        items:cart.map(i=>({id:i.id,name:i.name,team:i.team,size:i.size,customName:i.customName,customNum:i.customNum,qty:i.qty,price:i.price})),
        total,
        status:'ממתין לאישור'
      }]);
      if(error){ setSaveErr('שגיאה: '+error.message); setSaving(false); return; }
    }
    setSaving(false);
    setDone(true);
    setCart([]);
    setTimeout(()=>{setPage('home');setDone(false)},4000);
  };

  if(done) return(
    <div className="max-w-lg mx-auto px-5 py-28 text-center fade-up">
      <div className="text-6xl mb-6">🎉</div>
      <h2 className="display text-3xl font-black text-ink mb-3">ההזמנה התקבלה!</h2>
      <p className="text-mid text-sm">שלחנו אישור לאימייל שלך. נעדכן אותך בנוגע למשלוח.</p>
    </div>
  );

  return(
    <div className="max-w-5xl mx-auto px-5 py-10 fade-up">
      <button onClick={()=>setPage('catalog')} className="text-sm text-mid hover:text-ink transition-colors mb-6">← חזרה לחנות</button>
      <h1 className="display text-4xl font-black text-ink mb-10">קופה</h1>

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-10">
        <form onSubmit={submit} className="lg:col-span-3 space-y-6">
          {/* Shipping */}
          <div>
            <h3 className="font-black text-ink mb-4 pb-2 border-b border-smoke">פרטי משלוח</h3>
            <div className="grid grid-cols-2 gap-3">
              {[['name','שם מלא'],['phone','טלפון'],['email','אימייל'],['city','עיר']].map(([k,l])=>(
                <div key={k}>
                  <label className="text-xs text-mid mb-1 block">{l}</label>
                  <input required value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} className="px-3 py-2.5 text-sm rounded"/>
                </div>
              ))}
              <div className="col-span-2">
                <label className="text-xs text-mid mb-1 block">כתובת</label>
                <input required value={form.address} onChange={e=>setForm(f=>({...f,address:e.target.value}))} className="px-3 py-2.5 text-sm rounded"/>
              </div>
              <div className="col-span-2">
                <label className="text-xs text-mid mb-1 block">הערות</label>
                <textarea rows={2} value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} className="px-3 py-2.5 text-sm rounded resize-none"/>
              </div>
            </div>
          </div>

          {/* Payment */}
          <div>
            <h3 className="font-black text-ink mb-4 pb-2 border-b border-smoke">תשלום</h3>
            <div className="flex gap-3 mb-5">
              {[['paypal','PayPal'],['bank','העברה בנקאית']].map(([v,l])=>(
                <button type="button" key={v} onClick={()=>setPay(v)}
                  className={`flex-1 py-3 rounded text-sm font-bold border transition-all ${pay===v?'bg-ink text-paper border-ink':'border-smoke text-mid'}`}>
                  {l}
                </button>
              ))}
            </div>

            {pay==='paypal'&&(
              <div className="border border-smoke rounded p-5 text-center space-y-3">
                <p className="text-sm text-mid">תשלום מאובטח דרך PayPal</p>
                <div className="w-full bg-yellow-400 text-black font-black rounded py-3 text-sm cursor-pointer hover:bg-yellow-300 transition-colors flex items-center justify-center gap-2">
                  <span style={{color:'#003087',fontWeight:900}}>Pay</span><span style={{color:'#009cde',fontWeight:900}}>Pal</span>
                  <span className="mx-1">—</span>
                  <span>תשלום של ₪{total}</span>
                </div>
                <p className="text-xs text-mid">תועבר לאתר PayPal לאישור התשלום</p>
              </div>
            )}

            {pay==='bank'&&(
              <div className="border border-smoke rounded p-5 space-y-4">
                <div className="bg-paper rounded p-4 text-sm space-y-2">
                  <p className="font-black text-ink mb-3">פרטי חשבון בנק:</p>
                  {[['בנק','לאומי (10)'],['סניף','450'],['חשבון','12-345678'],['שם','Classic Jersey בע"מ']].map(([k,v])=>(
                    <div key={k} className="flex justify-between"><span className="text-mid">{k}:</span><span className="font-bold font-mono">{v}</span></div>
                  ))}

          <button type="submit" disabled={saving} className="btn-dark w-full rounded py-4 font-bold text-base disabled:opacity-60">
            {saving ? 'שומר הזמנה...' : `אשר הזמנה — ₪${total}`}
          </button>
        </form>

        {/* Summary */}
        <div className="lg:col-span-2">
          <div className="bg-white border border-smoke rounded p-5 sticky top-20">
            <h3 className="font-black text-ink mb-5 pb-2 border-b border-smoke">סיכום הזמנה</h3>
            <div className="space-y-4 mb-5 max-h-72 overflow-y-auto">
              {cart.map(item=>(
                <div key={item.cid} className="flex gap-3">
                  <div className="w-14 h-14 flex-shrink-0 overflow-hidden bg-smoke">
                    <img src={item.img} alt="" className="w-full h-full object-cover" onError={e=>e.target.style.display='none'}/>
                  </div>
                  <div className="flex-1 text-right">
                    <p className="text-xs font-bold text-ink leading-snug">{item.name}</p>
                    <p className="text-xs text-mid">×{item.qty} · {item.size}</p>
                  </div>
                  <p className="font-black text-sm flex-shrink-0">₪{(item.price+(item.customName||item.customNum?25:0))*item.qty}</p>
                </div>
              ))}
            </div>
            <div className="border-t border-smoke pt-4 space-y-2">
              <div className="flex justify-between text-sm"><span className="text-mid">ביניים</span><span>₪{total}</span></div>
              <div className="flex justify-between text-sm"><span className="text-mid">משלוח</span><span className="text-green-600 font-bold">חינם</span></div>
              <div className="flex justify-between font-black text-lg pt-2 border-t border-smoke"><span>סה"כ</span><span>₪{total}</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [form,setForm]=useState(blank);

  // Orders state
  const [orders,setOrders]=useState([]);
  const [ordersLoading,setOrdersLoading]=useState(false);
  const [ordersErr,setOrdersErr]=useState('');
  const [expandedOrder,setExpandedOrder]=useState(null);

  const loadOrders=async()=>{
    if(!window.db){setOrdersErr('Supabase לא מחובר — הוסף SUPABASE_URL ו-SUPABASE_KEY');return;}
    setOrdersLoading(true);setOrdersErr('');
    const{data,error}=await window.db.from('orders').select('*').order('created_at',{ascending:false});
    if(error)setOrdersErr('שגיאה: '+error.message);
    else setOrders(data||[]);
    setOrdersLoading(false);
  };

  const updateStatus=async(id,status)=>{
    if(!window.db)return;
    await window.db.from('orders').update({status}).eq('id',id);
    setOrders(os=>os.map(o=>o.id===id?{...o,status}:o));
  };

  React.useEffect(()=>{if(tab==='orders')loadOrders();},[tab]);

  const openEdit=p=>{setForm({...p});setEditId(p.id);setView('edit')};
  const openAdd=()=>{setForm(blank);setEditId(null);setView('edit')};
  const save=()=>{
    if(editId) setProducts(ps=>ps.map(p=>p.id===editId?{...form,id:editId,price:+form.price,stock:+form.stock}:p));
    else setProducts(ps=>[...ps,{...form,id:Date.now(),price:+form.price,stock:+form.stock}]);
    setView('list');
  };
  const del=id=>setProducts(ps=>ps.filter(p=>p.id!==id));
  const BADGE_MAP={'הכי נמכר':'hot','רטרו':'retro','חדש':'new','':(null)};

  const STATUS_COLORS={'ממתין לאישור':'bg-yellow-100 text-yellow-800','אושר':'bg-blue-100 text-blue-800','נשלח':'bg-green-100 text-green-800','בוטל':'bg-red-100 text-red-700'};
  const fmtDate=s=>new Date(s).toLocaleString('he-IL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

  return(
    <div className="max-w-6xl mx-auto px-5 py-10 fade-up">
      <div className="flex items-center justify-between mb-8">
        <div className="flex gap-3">
          <button onClick={()=>{setTab('products');setView('list')}}
            className={`rounded px-5 py-2.5 text-sm font-bold border transition-all ${tab==='products'?'bg-ink text-paper border-ink':'border-smoke text-mid'}`}>
            📦 מוצרים
          </button>
          <button onClick={()=>setTab('orders')}
            className={`rounded px-5 py-2.5 text-sm font-bold border transition-all ${tab==='orders'?'bg-ink text-paper border-ink':'border-smoke text-mid'}`}>
            🛍️ הזמנות
          </button>
          {tab==='products'&&view==='list'&&(
            <button onClick={openAdd} className="btn-red rounded px-5 py-2.5 text-sm font-bold">+ מוצר חדש</button>
          )}
          {tab==='products'&&view==='edit'&&(
            <button onClick={()=>setView('list')} className="btn-outline rounded px-5 py-2.5 text-sm">← חזרה</button>
          )}
        </div>
        <h1 className="display text-4xl font-black text-ink">לוח ניהול</h1>
      </div>

      {/* ── ORDERS TAB ─────────────────────────────────────────── */}
      {tab==='orders'&&(
        <div>
          <div className="flex items-center justify-between mb-5">
            <button onClick={loadOrders} className="btn-outline rounded px-4 py-2 text-sm font-bold">🔄 רענן</button>
            {!window.db&&(
              <div className="text-xs bg-yellow-50 border border-yellow-200 text-yellow-800 rounded px-3 py-2">
                Supabase לא מחובר — הוסף פרטי חיבור בקוד
              </div>
            )}
          </div>
          {ordersLoading&&<p className="text-mid text-sm py-10 text-center">טוען הזמנות...</p>}
          {ordersErr&&<p className="text-red-600 text-sm bg-red-50 border border-red-200 rounded px-3 py-2">{ordersErr}</p>}
          {!ordersLoading&&!ordersErr&&orders.length===0&&(
            <div className="bg-white border border-smoke rounded p-12 text-center">
              <div className="text-4xl mb-3">📭</div>
              <p className="text-mid font-bold">אין הזמנות עדיין</p>
            </div>
          )}
          {orders.length>0&&(
            <div className="space-y-3">
              {orders.map(o=>(
                <div key={o.id} className="bg-white border border-smoke rounded overflow-hidden">
                  <div className="flex items-center justify-between px-5 py-4 cursor-pointer hover:bg-paper transition-colors"
                    onClick={()=>setExpandedOrder(expandedOrder===o.id?null:o.id)}>
                    <div className="flex items-center gap-4">
                      <div className="text-left">
                        <span className={`text-xs font-bold rounded-full px-2.5 py-1 ${STATUS_COLORS[o.status]||'bg-gray-100 text-gray-700'}`}>{o.status}</span>
                      </div>
                      <div>
                        <p className="font-black text-ink text-sm">{o.name} — ₪{o.total}</p>
                        <p className="text-xs text-mid">{o.phone} · {o.city}</p>
                      </div>
                    </div>
                    <div className="text-left">
                      <p className="text-xs text-mid">{fmtDate(o.created_at)}</p>
                      <p className="text-xs text-mid mt-0.5">{o.payment_method==='paypal'?'PayPal':'העברה בנקאית'}</p>
                    </div>
                  </div>
                  {expandedOrder===o.id&&(
                    <div className="border-t border-smoke px-5 py-4 bg-paper">
                      <div className="grid grid-cols-2 gap-4 text-sm mb-4">
                        <div>
                          <p className="font-bold text-ink mb-1">פרטי לקוח</p>
                          <p className="text-mid text-xs">{o.email}</p>
                          <p className="text-mid text-xs">{o.address}, {o.city}</p>
                          {o.notes&&<p className="text-mid text-xs italic mt-1">"{o.notes}"</p>}
                        </div>
                        <div>
                          <p className="font-bold text-ink mb-1">פריטים</p>
                          {(o.items||[]).map((it,i)=>(
                            <p key={i} className="text-xs text-mid">{it.name} × {it.qty} (מידה {it.size}) — ₪{it.price*it.qty}</p>
                          ))}
                        </div>
                      </div>
                      <div className="flex gap-2 flex-wrap">
                        <p className="text-xs text-mid self-center ml-2">שנה סטטוס:</p>
                        {['ממתין לאישור','אושר','נשלח','בוטל'].map(s=>(
                          <button key={s} onClick={()=>updateStatus(o.id,s)}
                            className={`rounded px-3 py-1.5 text-xs font-bold border transition-all ${o.status===s?'bg-ink text-paper border-ink':'border-smoke text-mid hover:border-ink'}`}>
                            {s}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ── PRODUCTS TAB ───────────────────────────────────────── */}
      {tab==='products'&&view==='list'&&(
        <>
          {/* Stats */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            {[
              ['מוצרים','📦',products.length],
              ['במלאי','🟢',products.reduce((s,p)=>s+p.stock,0)],
              ['הנמכרות','🔥',products.filter(p=>p.badgeType==='hot').length],
              ['רטרו','🕰️',products.filter(p=>p.badgeType==='retro').length],
            ].map(([l,e,v])=>(
              <div key={l} className="bg-white border border-smoke rounded p-4 text-right">
                <div className="text-2xl mb-2">{e}</div>
                <div className="display text-2xl font-black text-ink">{v}</div>
                <div className="text-xs text-mid mt-0.5">{l}</div>
              </div>
            ))}
          </div>

          <div className="bg-white border border-smoke rounded overflow-x-auto">
            <table className="w-full text-sm min-w-[680px]">
              <thead>
                <tr className="border-b border-smoke text-right">
                  {['מוצר','קבוצה','מחיר','מלאי','תג','פעולות'].map(h=>(
                    <th key={h} className="px-5 py-3.5 text-xs font-black uppercase tracking-widest text-mid text-right">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {products.map(p=>(
                  <tr key={p.id} className="border-b border-smoke hover:bg-paper transition-colors">
                    <td className="px-5 py-3">
                      <div className="flex items-center gap-3 flex-row-reverse justify-end">
                        <div className="w-10 h-10 overflow-hidden bg-smoke flex-shrink-0">
                          <img src={p.img} alt="" className="w-full h-full object-cover" onError={e=>e.target.style.display='none'}/>
                        </div>
                        <span className="font-bold text-ink text-xs max-w-[160px] truncate">{p.name}</span>
                      </div>
                    </td>
                    <td className="px-5 py-3 text-mid text-xs">{p.team}</td>
                    <td className="px-5 py-3 font-black text-ink">₪{p.price}</td>
                    <td className="px-5 py-3">
                      <span className={`font-bold text-sm ${p.stock<=5?'text-red':'text-ink'}`}>{p.stock}</span>
                    </td>
                    <td className="px-5 py-3"><Badge type={p.badgeType} label={p.badge}/></td>
                    <td className="px-5 py-3">
                      <div className="flex gap-2">
                        <button onClick={()=>openEdit(p)} className="btn-outline rounded px-3 py-1.5 text-xs">ערוך</button>
                        <button onClick={()=>del(p.id)} className="rounded px-3 py-1.5 text-xs border border-red/30 text-red hover:bg-red/5 transition-colors">מחק</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      {tab==='products'&&view==='edit'&&(
        <div className="bg-white border border-smoke rounded p-6 max-w-xl mr-auto">
          <h2 className="font-black text-ink text-xl mb-6">{editId?'עריכת מוצר':'מוצר חדש'}</h2>
          <div className="grid grid-cols-2 gap-4">
            {[['name','שם המוצר'],['team','קבוצה'],['league','ליגה'],['era','עונה'],['price','מחיר ₪'],['stock','מלאי']].map(([k,l])=>(
              <div key={k} className={k==='name'?'col-span-2':''}>
                <label className="text-xs text-mid mb-1 block">{l}</label>
                <input value={form[k]||''} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} className="px-3 py-2.5 text-sm rounded"/>
              </div>
            ))}
            <div>
              <label className="text-xs text-mid mb-1 block">תג</label>
              <select value={form.badge||''} onChange={e=>setForm(f=>({...f,badge:e.target.value,badgeType:BADGE_MAP[e.target.value]}))}
                className="px-3 py-2.5 text-sm rounded">
                <option value="">ללא</option>
                <option>הכי נמכר</option><option>רטרו</option><option>חדש</option>
              </select>
            </div>
            <div>
              <label className="text-xs text-mid mb-1 block">צבע</label>
              <div className="flex gap-2 items-center">
                <input type="color" value={form.color||'#111'} onChange={e=>setForm(f=>({...f,color:e.target.value}))}
                  className="w-10 h-10 rounded cursor-pointer border-0 p-0 flex-shrink-0"/>
                <input value={form.color||''} onChange={e=>setForm(f=>({...f,color:e.target.value}))} className="px-3 py-2.5 text-sm rounded font-mono"/>
              </div>
            </div>
            <div className="col-span-2">
              <label className="text-xs text-mid mb-1 block">קישור תמונה (URL)</label>
              <input value={form.img||''} onChange={e=>setForm(f=>({...f,img:e.target.value}))}
                placeholder="https://..." className="px-3 py-2.5 text-sm rounded font-mono"/>
            </div>
            <div className="col-span-2">
              <label className="text-xs text-mid mb-1 block">תיאור</label>
              <textarea rows={3} value={form.description||''} onChange={e=>setForm(f=>({...f,description:e.target.value}))}
                className="px-3 py-2.5 text-sm rounded resize-none"/>
            </div>
          </div>

          {/* Preview */}
          {form.img&&(
            <div className="mt-5 border border-smoke rounded overflow-hidden flex gap-4 p-3">
              <div className="w-16 h-16 overflow-hidden bg-smoke flex-shrink-0">
                <img src={form.img} alt="" className="w-full h-full object-cover" onError={e=>e.target.style.display='none'}/>
              </div>
              <div className="text-right">
                <p className="font-bold text-ink text-sm">{form.name||'שם המוצר'}</p>
                <p className="text-mid text-xs">{form.team}</p>
                <p className="font-black text-ink mt-1">₪{form.price||'0'}</p>
              </div>
            </div>
          )}

          <div className="flex gap-3 mt-6">
            <button onClick={save} className="btn-dark rounded px-6 py-3 font-bold text-sm">שמור</button>
            <button onClick={()=>setView('list')} className="btn-outline rounded px-5 py-3 text-sm">ביטול</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── APP ────────────────────────────────────────────────────────── */
function App(){
  const [page,setPage]=useState('home');
  const [products,setProducts]=useState(PRODUCTS);
  const [selected,setSelected]=useState(null);
  const [cart,setCart]=useState([]);
  const [cartOpen,setCartOpen]=useState(false);

  const addToCart=useCallback((product,size,customName,customNum)=>{
    setCart(c=>{
      const ex=c.find(i=>i.id===product.id&&i.size===size&&i.customName===customName&&i.customNum===customNum);
      if(ex) return c.map(i=>i.cid===ex.cid?{...i,qty:i.qty+1}:i);
      return [...c,{...product,size,customName,customNum,qty:1,cid:Date.now()+Math.random()}];
    });
  },[]);

  const cartCount=cart.reduce((s,i)=>s+i.qty,0);

  return(
    <div className="min-h-screen" style={{background:'#f5f3ef'}}>
      <Navbar page={page} setPage={setPage} cartCount={cartCount} setCartOpen={setCartOpen}/>
      <CartDrawer cart={cart} setCart={setCart} open={cartOpen} setOpen={setCartOpen} setPage={setPage}/>
      {page==='home'&&<HomePage setPage={setPage} setSelectedProduct={setSelected} addToCart={addToCart} products={products}/>}
      {page==='catalog'&&<CatalogPage products={products} setPage={setPage} setSelectedProduct={setSelected} addToCart={addToCart}/>}
      {page==='product'&&<ProductPage product={selected} addToCart={addToCart} setPage={setPage}/>}
      {page==='checkout'&&<CheckoutPage cart={cart} setCart={setCart} setPage={setPage}/>}
      {page==='admin'&&<AdminPage products={products} setProducts={setProducts}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
